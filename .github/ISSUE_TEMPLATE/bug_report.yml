name: Bug report
description: Something in the app is wrong or crashes
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Menu, then What's new, shows "Installed".
      placeholder: "0.1.1"
    validations: { required: true }
  - type: input
    id: gamedata
    attributes:
      label: Game data
      description: Menu, then Game data. Filled in for you when you report from the app.
      placeholder: "Chummer 5.226.0 [b4bfed06]"
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Galaxy S24 Ultra, Android 16
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps from opening the app, and the character's build method if it matters (Karma, Priority, Sum-to-Ten).
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: Filled in by the app's Report on GitHub button after a crash. Leave empty otherwise.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots help. Do not attach characters you want to keep private.
